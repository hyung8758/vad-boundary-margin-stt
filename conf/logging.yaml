version: 1
disable_existing_loggers: false
log_path: logs

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: logs/vad_experiments.log
    encoding: utf-8

root:
  level: INFO
  handlers: [console, file]
